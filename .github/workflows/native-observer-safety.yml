name: Native observer protections
on:
  pull_request:
    paths:
      - 'tools/native-client-observer/**'
      - 'tools/native-client-neoforge/**'
      - '.github/workflows/native-observer-safety.yml'
  push:
    branches: [main]
    paths:
      - 'tools/native-client-observer/**'
      - 'tools/native-client-neoforge/**'
      - '.github/workflows/native-observer-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require the native menu protection hooks
        run: node tools/native-client-neoforge/check-container-protection.mjs
      - name: Verify timeout, travel, pin and exact ownership
        run: |
          mkdir -p "$RUNNER_TEMP/observer-checks"
          javac --release 21 -d "$RUNNER_TEMP/observer-checks" \
            tools/native-client-observer/InventoryTravelPolicy.java \
            tools/native-client-observer/SpectatorDetails.java \
            tools/native-client-observer/test/InventoryTravelPolicyCheck.java \
            tools/native-client-observer/test/SpectatorDetailsCheck.java
          java -cp "$RUNNER_TEMP/observer-checks" InventoryTravelPolicyCheck
          java -cp "$RUNNER_TEMP/observer-checks" SpectatorDetailsCheck
