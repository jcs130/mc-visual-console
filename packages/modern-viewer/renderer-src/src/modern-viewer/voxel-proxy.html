<!doctype html><html><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three.module.js"}}</script>
<canvas id="film" width="1280" height="704"></canvas>
<script type="module">
import * as THREE from 'three';
import {bakeFaces} from '../native-viewer/model-loader.js';
import {selectProxyModels,atlasFaceUV} from './voxel-proxy-catalog.mjs';
import {proxyFacing,checkedProxyPose} from './voxel-proxy-pose.mjs';
import {organicProxyKind,organicProxyTransform} from './voxel-proxy-organic.mjs';
const [snapshot,definitions,config,assetEvidence]=await Promise.all(['/scene.json','/catalog.json','/render.json','/asset-evidence.json'].map(async p=>(await fetch(p)).json()));
if(snapshot.schema!=='agent-mc-voxel-scene/v1'||snapshot.order!=='x-y-z')throw Error('Unsupported scene protocol');
const canvas=document.querySelector('#film'),renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true});
renderer.setSize(1280,704,false);renderer.toneMapping=THREE.NoToneMapping;
const world=new THREE.Scene(),light=new THREE.DirectionalLight(0xffffff,1.65);light.position.set(1,2,1);
world.add(light,new THREE.AmbientLight(0xffffff,1.3));
const camera=new THREE.PerspectiveCamera(snapshot.camera.fovDegrees,1280/704,.05,160);
const air=new Set(['minecraft:air','minecraft:cave_air','minecraft:void_air']);
const names=[...new Set(snapshot.palette.map(p=>p.name).filter(n=>!air.has(n)))].sort();
if(config.showSelf)names.push('agent:self');
const legend=names.map((name,i)=>{const c=new THREE.Color().setHSL((i*.61803398875)%1,.7,.48);return {name,id:i+1,color:'#'+c.getHexString(THREE.LinearSRGBColorSpace)};});
const ids=new Map(legend.map(x=>[x.name,x])),approximations=new Set(),unverifiedSeeds=new Set(),tints=new Set();
const atlas=await new THREE.TextureLoader().loadAsync('/atlas.png');atlas.colorSpace=THREE.SRGBColorSpace;
atlas.magFilter=THREE.NearestFilter;atlas.minFilter=THREE.NearestFilter;
const surfaceStyle=config.surfaceStyle??'original';
if(!['original','material-hints'].includes(surfaceStyle))throw Error('Unsupported model-input surface style');
const geometryStyle=config.geometryStyle??'original';
if(!['original','organic-hints'].includes(geometryStyle))throw Error('Unsupported model-input geometry style');
const organicClasses=new Set();
const averageCache=new Map(),sampleCanvas=document.createElement('canvas');sampleCanvas.width=atlas.image.width;sampleCanvas.height=atlas.image.height;
const sampleContext=sampleCanvas.getContext('2d',{willReadFrequently:true});sampleContext.drawImage(atlas.image,0,0);
function averageTexture(rect){
 const key=JSON.stringify(rect);if(averageCache.has(key))return averageCache.get(key);
 const x=Math.floor(Math.min(rect.u,rect.u+rect.su)*sampleCanvas.width),y=Math.floor(Math.min(rect.v,rect.v+rect.sv)*sampleCanvas.height);
 const w=Math.max(1,Math.round(Math.abs(rect.su)*sampleCanvas.width)),h=Math.max(1,Math.round(Math.abs(rect.sv)*sampleCanvas.height));
 const data=sampleContext.getImageData(x,y,w,h).data;let r=0,g=0,b=0,n=0;
 for(let i=0;i<data.length;i+=4)if(data[i+3]>48){r+=data[i];g+=data[i+1];b+=data[i+2];n++;}
 const color=n?new THREE.Color().setRGB(r/n/255,g/n/255,b/n/255,THREE.SRGBColorSpace):new THREE.Color(1,1,1);averageCache.set(key,color);return color;
}
const material=new THREE.MeshLambertMaterial({map:atlas,vertexColors:true,alphaTest:.1,side:THREE.DoubleSide});
if(surfaceStyle==='material-hints')material.onBeforeCompile=shader=>{shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>','vec4 sampledDiffuseColor = texture2D( map, vMapUv ); diffuseColor.a *= sampledDiffuseColor.a;');};
// Keep cutout alpha but discard RGB on the semantic pass. The flat class ID is never a DINO input.
const semanticMaterial=new THREE.MeshBasicMaterial({map:atlas,alphaTest:.1,toneMapped:false,side:THREE.DoubleSide});
semanticMaterial.onBeforeCompile=shader=>{shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>','vec4 sampledDiffuseColor = texture2D( map, vMapUv ); diffuseColor.a *= sampledDiffuseColor.a;');};
const entries=[],batches=new Map(),templateCache=new Map();
function addGeometry(key,geometry,name,position){let b=batches.get(key);if(!b)batches.set(key,b={geometry,name,positions:[]});b.positions.push(position);}
function shapeGeometry(shape){return new THREE.BoxGeometry(shape[3]-shape[0],shape[4]-shape[1],shape[5]-shape[2]).translate((shape[0]+shape[3])/2-.5,(shape[1]+shape[4])/2-.5,(shape[2]+shape[5])/2-.5);}
function specialized(p){
 if(!config.allowDocumentedApproximations)throw Error('VOXEL_SPECIAL_RENDERER_UNAVAILABLE:'+p.name);
 const n=p.name.slice(10);let shapes;
 if(n==='water'||n==='lava'){
  approximations.add(p.name+': flat fluid surface; flow, biome and occlusion are not exact');
  const level=Number(p.properties.level??0);shapes=[[0,0,0,1,level>=8?1:Math.max(.125,1-level/8),1]];
 }else if(n.endsWith('_banner')){
  approximations.add(p.name+': cloth proxy; block entity patterns and waving are unavailable');
  shapes=[[.47,0,.47,.53,1.8,.53],[.22,.6,.49,.78,1.65,.51]];
 }else throw Error('VOXEL_SPECIAL_RENDERER_UNAVAILABLE:'+p.name);
 return shapes.map(s=>({geometry:shapeGeometry(s),solidColor:n==='water'?'#4384bf':n==='lava'?'#e36d19':'#77513b'}));
}
const [ax,ay,az]=snapshot.bounds.min,[bx,by,bz]=snapshot.bounds.max;let cell=0;
for(let x=ax;x<=bx;x++)for(let y=ay;y<=by;y++)for(let z=az;z<=bz;z++,cell++){
 const pi=snapshot.cells[cell];if(pi<0)continue;const p=snapshot.palette[pi];if(air.has(p.name))continue;
 const selection=selectProxyModels(definitions,p,{x,y,z},{allowUnverifiedTextureVariation:config.allowDocumentedApproximations});
 if(!selection.exactSeed)unverifiedSeeds.add(p.name);
 const organic=geometryStyle==='organic-hints'?organicProxyKind(p.name):null;
 if(organic){
  organicClasses.add(p.name);const transform=organicProxyTransform(x,y,z,organic),key='organic:'+p.name;
  if(!templateCache.has(key))templateCache.set(key,[{geometry:new THREE.IcosahedronGeometry(organic==='foliage'?.72:.65,organic==='foliage'?2:0)}]);
  addGeometry(key,templateCache.get(key)[0].geometry,p.name,[...transform.position,...transform.scale]);
  const texture=selection.models[0]?.model?.elements[0]?.faces?.up?.texture;
  if(!texture)throw Error('Original organic material evidence missing:'+p.name);
  const color=averageTexture(texture).clone();if(organic==='foliage'){color.multiply(new THREE.Color('#86a95b'));tints.add(p.name);}
  batches.get(key).solidColor='#'+color.getHexString();continue;
 }
 const signature=p.name+JSON.stringify(selection.models);
 let templates=templateCache.get(signature);
 if(!templates){
  templates=[];
  for(const variant of selection.models){
   const faces=bakeFaces(variant.model,variant,{allowTint:true,resolveTexture:(_,value)=>value});
   if(!faces.length)continue;
   const positions=[],uvs=[],colors=[],indices=[],rotation=new THREE.Euler(-THREE.MathUtils.degToRad(variant.x||0),-THREE.MathUtils.degToRad(variant.y||0),0,'YXZ');
   for(const f of faces){const base=positions.length/3;for(let i=0;i<f.position.length;i+=3)positions.push(...new THREE.Vector3(...f.position.slice(i,i+3)).applyEuler(rotation).toArray());
    uvs.push(...atlasFaceUV(f));
    const tint=f.tintIndex<0?new THREE.Color(1,1,1):new THREE.Color(p.name==='minecraft:redstone_wire'?'#bf2419':'#86a95b');
    if(surfaceStyle==='material-hints')tint.multiply(averageTexture(f.texture));
    if(f.tintIndex>=0)tints.add(p.name);for(let i=0;i<4;i++)colors.push(tint.r,tint.g,tint.b);
    indices.push(...f.indices.map(i=>i+base));}
   const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(indices);g.computeVertexNormals();templates.push({geometry:g});
  }
  if(!templates.length&&selection.models.length)templates=specialized(p);
  templateCache.set(signature,templates);
 }
 templates.forEach((t,i)=>{const key=signature+':'+i;addGeometry(key,t.geometry,p.name,[x+.5,y+.5,z+.5]);batches.get(key).solidColor=t.solidColor;});
}
for(const b of batches.values()){
 const rgb=b.solidColor?new THREE.MeshLambertMaterial({color:b.solidColor}):material;
 const sem=b.solidColor?new THREE.MeshBasicMaterial({toneMapped:false}):semanticMaterial;
 const mesh=new THREE.InstancedMesh(b.geometry,rgb,b.positions.length),dummy=new THREE.Object3D();
 b.positions.forEach((position,i)=>{dummy.position.set(...position.slice(0,3));dummy.scale.set(...(position.length===6?position.slice(3):[1,1,1]));dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);});
 entries.push({mesh,rgb,sem,name:b.name});world.add(mesh);
}
let selfActor;
if(config.showSelf){
 // Neutral placement marker: identity reference replaces it in the anchor edit.
 // A pose snapshot cannot establish the actual ongoing limb animation.
 const actor=new THREE.Group();selfActor=actor;actor.position.set(...snapshot.camera.feet);actor.rotation.y=snapshot.camera.yaw;
 const parts=[[[.4,.65,.25],[0,.85,0]],[[.38,.38,.38],[0,1.48,0]],[[.14,.5,.16],[-.28,.87,0]],[[.14,.5,.16],[.28,.87,0]],[[.15,.55,.17],[-.12,.28,0]],[[.15,.55,.17],[.12,.28,0]]];
 for(const [size,pos] of parts){const rgb=new THREE.MeshLambertMaterial({color:'#d7c7ae'}),sem=new THREE.MeshBasicMaterial({toneMapped:false});const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),rgb);mesh.position.set(...pos);actor.add(mesh);entries.push({mesh,rgb,sem,name:'agent:self'});}
 // A visible front/back distinction prevents a reference-sheet face becoming an implicit pose instruction.
 const cues=[[[.39,.28,.035],[0,1.53,.195],'#61503e'],[[.24,.38,.035],[0,.88,.14],'#796145'],[[.04,.035,.025],[-.085,1.51,-.2],'#29221c'],[[.04,.035,.025],[.085,1.51,-.2],'#29221c'],[[.065,.06,.06],[0,1.43,-.215],'#b79b7e']];
 for(const [size,pos,color] of cues){const rgb=new THREE.MeshLambertMaterial({color}),sem=new THREE.MeshBasicMaterial({toneMapped:false});const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),rgb);mesh.position.set(...pos);actor.add(mesh);entries.push({mesh,rgb,sem,name:'agent:self'});}
 world.add(actor);
}
let mode='';function colors(next){if(mode===next)return;mode=next;const semantic=next==='semantic';renderer.outputColorSpace=semantic?THREE.LinearSRGBColorSpace:THREE.SRGBColorSpace;
 world.background=new THREE.Color(semantic?'#000000':'#aac4dc');
 for(const e of entries){e.mesh.material=semantic?e.sem:e.rgb;if(semantic){const c=new THREE.Color().setHex(parseInt(ids.get(e.name).color.slice(1),16),THREE.LinearSRGBColorSpace);if(e.mesh.isInstancedMesh){for(let i=0;i<e.mesh.count;i++)e.mesh.setColorAt(i,c);e.mesh.instanceColor.needsUpdate=true;}else e.sem.color.copy(c);}else if(e.mesh.isInstancedMesh&&e.mesh.instanceColor){for(let i=0;i<e.mesh.count;i++)e.mesh.setColorAt(i,new THREE.Color(1,1,1));e.mesh.instanceColor.needsUpdate=true;}}
}
window.setProxyPose=pose=>{snapshot.camera=checkedProxyPose(pose);camera.fov=snapshot.camera.fovDegrees;camera.updateProjectionMatrix();if(selfActor){selfActor.position.set(...pose.feet);selfActor.rotation.y=pose.yaw;}};
window.renderProxy=(offset=0,semantic=false,{mime='image/png',quality=.88}={})=>{
 if(!['image/png','image/jpeg'].includes(mime)||!Number.isFinite(quality)||quality<.1||quality>1||semantic&&mime!=='image/png')throw Error('Lossless semantic PNG or explicit RGB frame encoding required');
 colors(semantic?'semantic':'rgb');const pose=snapshot.camera;camera.up.set(0,1,0);
 if(config.cameraOffset){const o=new THREE.Vector3(...config.cameraOffset).applyAxisAngle(new THREE.Vector3(0,1,0),offset);camera.position.set(...pose.feet).add(o);camera.lookAt(new THREE.Vector3(...pose.feet).add(new THREE.Vector3(0,1,0)));}
 else{camera.position.set(...pose.eye);const yaw=pose.yaw+offset,pitch=pose.pitch,cp=Math.cos(pitch);camera.lookAt(camera.position.clone().add(new THREE.Vector3(-Math.sin(yaw)*cp,Math.sin(pitch),-Math.cos(yaw)*cp)));}
 renderer.render(world,camera);return canvas.toDataURL(mime,quality);
};
function projectSelf(height){const p=new THREE.Vector3(...snapshot.camera.feet).add(new THREE.Vector3(0,height,0)).project(camera);return {x:(p.x+1)/2,y:(1-p.y)/2};}
window.proxyDetails=()=>({schema:'agent-mc-proxy-semantics/v1',renderer:{threeRevision:THREE.REVISION,capabilities:{setProxyPose:true,rgbFrameFormats:['image/png','image/jpeg'],semanticFrameFormats:['image/png']}},sceneSchema:snapshot.schema,source:snapshot.source,sourceSampledAt:snapshot.sampledAt,camera:snapshot.camera,
 surfaceStyle,geometryStyle,organicClasses:[...organicClasses],viewport:{width:1280,height:704},renderPurpose:surfaceStyle==='original'&&geometryStyle==='original'?'original-material-proxy':'artistic-model-input-abstraction',
 virtualCamera:config.cameraOffset?{offset:config.cameraOffset,kind:'explicit-third-person-composition'}:null,bounds:snapshot.bounds,backgroundIsObservedSky:false,coverage:snapshot.coverage,legend,
 assetEvidence,visualApproximations:[...approximations],unverifiedTextureSeeds:[...unverifiedSeeds],approximateTintClasses:[...tints],unmappedNaturalColors:[],
 self:config.showSelf?{uuid:snapshot.source.uuid,feet:snapshot.camera.feet,yaw:snapshot.camera.yaw,pose:'neutral-placement-proxy',animationObserved:false,identity:'external-reference-required',
 placementFacing:proxyFacing(snapshot.camera.yaw,config.cameraOffset),projectedFeet:projectSelf(0),projectedHead:projectSelf(1.72)}:null,
 caveat:'Original versioned state models/textures for a bounded scene. Listed fluid/entity/tint approximations are not exact Java scene parity. Semantic image is an anchor reference, not a native EdenLive class-ID channel.'});
window.semanticPixels=()=>{const gl=renderer.getContext(),pixels=new Uint8Array(1280*704*4);gl.readPixels(0,0,1280,704,gl.RGBA,gl.UNSIGNED_BYTE,pixels);const known=new Map(legend.map(x=>[parseInt(x.color.slice(1),16),{...x,pixels:0,bounds:{left:1280,top:704,right:0,bottom:0}}]));let background=0,unmatched=0;
 for(let i=0;i<pixels.length;i+=4){const key=(pixels[i]<<16)|(pixels[i+1]<<8)|pixels[i+2];if(key===0){background++;continue;}const item=known.get(key);if(item){item.pixels++;const x=(i/4)%1280,y=703-Math.floor(i/4/1280);item.bounds.left=Math.min(item.bounds.left,x);item.bounds.right=Math.max(item.bounds.right,x);item.bounds.top=Math.min(item.bounds.top,y);item.bounds.bottom=Math.max(item.bounds.bottom,y);}else unmatched++;}
 return {visible:[...known.values()].filter(x=>x.pixels>0).sort((a,b)=>b.pixels-a.pixels),background,unmatched,total:1280*704};};
window.renderProxy(0,false);window.proxyReady=true;
</script></html>
