<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Agent World · 原生机械模型</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#111820;color:#e5ecef}
    body{margin:0} header{padding:22px 30px;border-bottom:1px solid #34444c;background:#17232b} h1{font-size:24px;font-weight:550;margin:0 0 8px} p{color:#a7bbc5;font-size:14px;margin:0;line-height:1.6}
    main{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:calc(100vh - 120px)} #viewport{min-height:540px;position:relative} canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
    aside{padding:24px;background:#17232b;border-left:1px solid #34444c} .tag{display:inline-block;color:#8cd6b2;border:1px solid #416d5b;border-radius:5px;padding:5px 9px;font-size:12px;margin-bottom:22px} h2{font-size:16px;margin:22px 0 10px} .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:12px 0;border-bottom:1px solid #2c3b44} .value{font-variant-numeric:tabular-nums;color:#a9d8ee} button{background:#254152;border:1px solid #47748b;border-radius:5px;color:#e5ecef;padding:10px 12px;cursor:pointer;font-size:13px} .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px} #error{position:relative;z-index:2;color:#ffb5a9;padding:20px;white-space:pre-wrap} #error:empty{display:none} .caption{position:absolute;z-index:1;left:20px;bottom:20px;font-size:13px;color:#a7bbc5;background:#17232bd9;padding:9px 12px;border-radius:4px} .small{font-size:12px;color:#91a8b4;margin-top:20px;line-height:1.7} #progress{margin-top:20px;color:#a7bbc5;font-size:13px}
    @media(max-width:760px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #34444c}#viewport{min-height:400px}header{padding:20px}}
  </style>
</head>
<body>
  <header><h1>My Agent World · 原生机械模型</h1><p>Create 原始模型与贴图，重放同一 Mineflayer 玩家连接采集的转速变化。</p></header>
  <main>
    <div id="viewport"><div class="caption">模型验收台 · 非完整世界画面</div><div id="error" role="alert"></div></div>
    <aside>
      <div class="tag">联机记录回放</div><p id="status" role="status">正在核对模型与贴图…</p>
      <h2>真实动力状态</h2>
      <div class="row"><span>传动轴</span><span class="value" id="shaft-speed">未知</span></div>
      <div class="row"><span>曲柄</span><span class="value" id="crank-speed">未知</span></div>
      <div class="row"><span>握柄角度</span><span class="value" id="handle-angle">未知</span></div>
      <div class="row"><span>已渲染帧</span><span class="value" id="frames">0</span></div>
      <div id="progress">等待服务器记录</div>
      <div class="controls"><button id="positive" disabled>正转片段</button><button id="negative" disabled>反转片段</button><button id="stopped" disabled>停止片段</button><button id="pause" disabled>暂停</button><button id="restart" disabled>重新播放</button></div>
      <p class="small" id="source">不使用替代模型。缺失资源或状态会明确报错。</p>
      <p class="small">鼠标拖动旋转视角，滚轮缩放。光照与完整场景还需对照 Java 客户端验收。</p>
    </aside>
  </main>
  <script type="module" src="/client.js"></script>
</body>
</html>
