<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mc-visual-console</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="bar">
    <span class="brand">mc-visual-console</span>
    <span id="banner">连接中…</span>
    <span class="spacer"></span>
    <span id="holder" class="dim">—</span>
    <span id="counts" class="dim">0 实体 · 0 方块</span>
    <button id="claim" title="接管（快捷键 C）">接管</button>
    <button id="release" title="释放（快捷键 R）">释放</button>
    <span id="zoom" class="dim">100%</span>
  </header>

  <main>
    <canvas id="scene"></canvas>
    <aside id="side">
      <h3>事件</h3>
      <pre id="log"></pre>
      <p class="hint">
        悬停看对象 · 点地面走过去 · 右键/长按出动作菜单 · 滚轮缩放 · Shift+拖动 平移
      </p>
    </aside>
  </main>

  <div id="tooltip" hidden></div>
  <div id="menu" hidden></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
