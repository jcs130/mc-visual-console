<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent MC · 连接台</title><link rel="stylesheet" href="/console.css"></head>
<body><main>
<header><a class="brand" href="/">A<span>MC</span></a><div><h1>连接台</h1><p>让你的 Agent 进入 Minecraft</p></div><span id="phase" class="badge">读取中</span></header>
<section class="server"><div><span class="eyebrow">JAVA SERVER</span><h2 id="address">—</h2><p id="version">正在读取连接</p></div><div class="actions"><button data-action="connect" class="primary">连接服务器</button><button data-action="disconnect" class="quiet">断开连接</button></div></section>
<div class="grid"><section class="accounts"><div class="section-title"><h2>账号与客户端</h2><span>各账号分别授权</span></div><div id="accounts"></div></section>
<aside><section><div class="section-title"><h2>游戏画面</h2><span>WEB / OBS</span></div><div id="views" class="view-links"></div><p id="asset-note" class="note"></p></section>
<section class="help"><h2>首次接入</h2><ol><li>在私有配置文件填写服务器、验证方式和账号标识。</li><li>正版账号首次连接时，在微软页面输入登录码。</li><li>需要原生游戏窗口时，先用官方或可信启动器安装对应版本，再设置游戏目录与 Java。</li></ol><p>账号标识用于本地缓存；实际游戏名以验证结果为准。Agent、观察者和玩家同时进服需要不同账号。观察者附身由服务器权限或插件决定。</p></section></aside></div>
<footer><span id="updated">尚未采样</span><span id="notice" role="status"></span><span>Agent MC World · 本机控制</span></footer>
</main><script type="module" src="/console.js"></script></body></html>
